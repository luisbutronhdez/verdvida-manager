function insightRecommendations(a){let list=[];if(!a.current.length)return [{title:'Aún no hay ventas para analizar',why:'El periodo seleccionado no contiene tickets registrados.',action:'Registra ventas de demostración desde el punto de venta y vuelve a consultar el tablero.'}];if(a.previous.length&&a.stats.revenue<a.prev.revenue)list.push({title:'Revisar caída de ingresos',why:`Las ventas netas son ${money(a.stats.revenue)} frente a ${money(a.prev.revenue)} del periodo anterior.`,action:'Compara número de tickets y ticket promedio antes de decidir una promoción.'});if(a.top.length)list.push({title:'Aprovechar el producto líder',why:`${a.top[0].name} acumula ${a.top[0].units} unidades en el periodo.`,action:'Verifica disponibilidad y prueba ofrecer un complemento pertinente; mide aceptación y ticket promedio.'});if(a.low.some(x=>x.units===0))list.push({title:'Revisar productos sin desplazamiento',why:`${a.low.filter(x=>x.units===0).length} productos activos no registran ventas en el periodo.`,action:'Revisa exhibición, disponibilidad y demanda antes de retirar productos del catálogo.'});if(!a.hasUpsellTracking)list.push({title:'Medir la venta sugerida',why:'El historial del periodo no tiene marcas de productos agregados desde la sugerencia.',action:'Registra nuevas ventas usando «Ofrécele al cliente» para comenzar a medir unidades e ingresos atribuibles.'});return list.slice(0,5)}

const VD_TIMEZONE='America/Mexico_City';
function vdDayKey(at){
 const d=new Date(at);if(!Number.isFinite(d.getTime()))return '';
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:VD_TIMEZONE,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
 const obj=Object.fromEntries(parts.map(x=>[x.type,x.value]));return `${obj.year}-${obj.month}-${obj.day}`;
}
function vdPreviousDay(key){const d=new Date(key+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}

 return `<div class="today-dash stack"><div class="today-head"><div><span class="today-eyebrow">VERDVIDA · CONTROL EN VIVO</span><h1>Dashboard Ejecutivo</h1><p>Ventas de hoy · ${esc(dateText)} · Hora de Veracruz</p></div><button class="btn secondary" data-action="refreshToday">↻ Actualizar</button></div>
 <div class="today-primary"><span>Venta acumulada hoy</span><strong>${money(now.revenue)}</strong><small>${now.tickets} tickets registrados ${syncMode?'en Supabase':'en este dispositivo'}</small></div>

 <section class="card stack"><h2>🏆 Top 5 productos de hoy</h2>${top.length?top.map((x,i)=>`<div class="today-topline"><span class="rank">${i+1}</span><span class="name">${esc(x.name)}</span><b>${x.units} uds.</b></div>`).join(''):'<p class="muted">Todavía no hay productos vendidos hoy.</p>'}<p class="small-quiet">Ordenados por unidades vendidas.</p></section>
 <section class="card stack"><h2>💳 Pagos de hoy</h2>${payments.map(x=>`<div class="row line"><span>${esc(x.name)}</span><b>${money(x.total)}</b></div>`).join('')}</section>
 <section class="card stack"><h2>🧾 Últimas ventas</h2>${sales.slice().sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,5).map(x=>`<div class="row line"><span>${new Intl.DateTimeFormat('es-MX',{timeZone:VD_TIMEZONE,hour:'2-digit',minute:'2-digit'}).format(new Date(x.at))} · ${esc((x.items||[]).map(i=>i.name).slice(0,2).join(', '))}</span><b>${money(x.total)}</b></div>`).join('')||'<p class="muted">Sin tickets hoy.</p>'}</section></div>
 <div class="insight-toolbar"><div class="insight-period">${[['today','Hoy'],['7','7 días'],['30','30 días'],['90','90 días']].map(([v,label])=>`<button class="${insightPeriod===v?'on':''}" data-insight-period="${v}">${label}</button>`).join('')}</div><span class="small-quiet">Actualización automática cada 60 segundos mientras este panel está abierto</span></div>

function dashboard(){if(insightPeriod==='today')return dashboardToday();let a=insightAnalyze(),s=a.stats,periods=[['today','Hoy'],['7','7 días'],['30','30 días'],['90','90 días']],recs=insightRecommendations(a);let dayNames=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];let days=dayNames.map((name,i)=>{let count=0;for(let d=new Date(a.start);d<=a.end;d.setDate(d.getDate()+1))if(d.getDay()===i)count++;let revenue=a.current.filter(x=>insightDate(x.at).getDay()===i).reduce((z,x)=>z+insightNum(x.total),0);return {name,count,revenue,avg:count?revenue/count:0}}).filter(x=>x.count).sort((x,y)=>y.avg-x.avg);let hours=Array.from({length:9},(_,i)=>i+8).map(h=>({hour:h,count:a.byHour.get(h)||0}));let cards=[['Ventas netas',money(s.revenue),insightDelta(s.revenue,a.prev.revenue)],['Tickets',String(s.tickets),insightDelta(s.tickets,a.prev.tickets)],['Ticket promedio',s.tickets?money(s.avg):'—',insightDelta(s.avg,a.prev.avg)],['Unidades vendidas',String(s.units),'Productos registrados']];if(syncMode&&!cloudReady)return `<div class="dashboard-hero"><h1>VerDvida · Dashboard Ejecutivo</h1><p>Esperando conexión y actualización de Supabase</p></div><div class="notice">Sin datos consultados. No se muestran indicadores para evitar confundir falta de conexión con cero ventas. Ve a Respaldo → Conectar → Actualizar ventas nube.</div>`;return `<div class="dashboard-hero"><h1>VerDvida · Dashboard Ejecutivo</h1><div>Inteligencia comercial · ${syncMode?(cloudReady?'Ventas registradas en Supabase (todos los dispositivos de esta cuenta)':'Nube no consultada: indicadores pendientes'):'Datos registrados en este navegador'}</div></div>${syncMode&&!cloudReady?'<div class="notice">Modo nube activo, pero sin conexión validada. Los indicadores están pendientes; no significan ventas cero.</div>':''}<div class="insight-toolbar"><div class="insight-period">${periods.map(([v,label])=>`<button class="${insightPeriod===v?'on':''}" data-insight-period="${v}">${label}</button>`).join('')}
