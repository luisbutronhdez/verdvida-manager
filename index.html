function editModal(id){let p=data.products.find(x=>x.id===id);let body=p.variants.map((v,i)=>`<label class="field">${esc(v.name)} · precio MXN<input type="number" min="0" step="0.01" data-price="${i}" value="${v.price}"></label>`).join('');let d=document.createElement('div');d.className='modalback';d.id='editBack';d.innerHTML=`<div class="modal stack"><div class="row"><h2>${esc(p.name)}</h2><button class="btn secondary" data-action="cancelEdit">✕</button></div>${body}<button class="btn" data-action="savePrices" data-id="${id}">Guardar precios</button></div>`;document.body.appendChild(d)}
app.addEventListener('click',e=>{let t=e.target.closest('[data-view],[data-group],[data-cat],[data-product],[data-action],[data-variant],[data-mod],[data-inc],[data-dec],[data-edit]');if(!t)return;if(t.dataset.view){view=t.dataset.view;notice='';render();return}if(t.dataset.group){group=t.dataset.group;category='Todos';query='';render();return}if(t.dataset.cat){category=t.dataset.cat;render();return}if(t.dataset.product){selected=t.dataset.product;selectedVariant=0;selectedMods={};render();return}if(t.dataset.variant!==undefined){selectedVariant=Number(t.dataset.variant);render();return}if(t.dataset.mod){let [i,j]=t.dataset.mod.split(':').map(Number);selectedMods[i]=j;render();return}if(t.dataset.inc!==undefined){cart[Number(t.dataset.inc)].qty++;render();return}if(t.dataset.dec!==undefined){let i=Number(t.dataset.dec);cart[i].qty--;if(cart[i].qty===0)cart.splice(i,1);render();return}if(t.dataset.edit){editModal(t.dataset.edit);return}let a=t.dataset.action;if(a==='cancelModal'){selected=null;render()}if(a==='cancelEdit')document.getElementById('editBack')?.remove();if(a==='login'){let r=document.getElementById('loginRole').value,p=document.getElementById('pin').value;if(p===(r==='admin'?'1234':'2468')){role=r;view='venta';notice='';render()}else{notice='PIN incorrecto';render()}}if(a==='logout'){role=null;cart=[];render()}if(a==='clear'){cart=[];render()}if(a==='addConfigured'){let p=selectedP();if(p.modifiers.some((m,i)=>m.required&&selectedMods[i]===undefined)){alert('Selecciona las opciones obligatorias del platillo.');return}let v=p.variants[selectedVariant],unit=v.price+p.modifiers.reduce((s,m,i)=>s+(m.prices?.[selectedMods[i]]||0),0),labels=p.modifiers.map((m,i)=>m.options[selectedMods[i]]).filter(Boolean),key=p.id+'|'+selectedVariant+'|'+JSON.stringify(selectedMods),existing=cart.find(x=>x.key===key);if(existing)existing.qty++;else cart.push({key,productId:p.id,name:p.name,category:p.category,variant:v.name,unit,modLabels:labels,qty:1});selected=null;view='venta';render()}if(a==='open'){let n=Number(document.getElementById('opening').value);if(!Number.isFinite(n)||n<0)return alert('Fondo inválido');data.shifts.push({id:Date.now(),opening:n,at:new Date().toISOString(),closed:false});save();render()}if(a==='close'){let s=shift(),el=document.getElementById('counted');if(!el||el.value==='')return alert('Ingresa el efectivo contado');let n=Number(el.value);if(!Number.isFinite(n)||n<0)return alert('Importe inválido');let cash=data.sales.filter(x=>x.shiftId===s.id&&x.pay==='Efectivo').reduce((a,x)=>a+x.total,0);s.counted=n;s.expected=s.opening+cash;s.difference=n-s.expected;s.closed=true;s.closedAt=new Date().toISOString();save();notice='Caja cerrada. Diferencia: '+money(s.difference);render()}if(a==='complete'){if(!shift()||!cart.length)return;let n=Number(received);if(pay==='Efectivo'&&(received===''||!Number.isFinite(n)||n<total()))return alert('Efectivo recibido insuficiente');if(pay!=='Efectivo'&&!confirm('¿Confirmas que verificaste el pago externamente?'))return;data.sales.push({id:data.seq++,at:new Date().toISOString(),shiftId:shift().id,orderType,source,pay,total:total(),items:clone(cart)});save();cart=[];received='';view='historial';notice='Venta de demostración registrada en este navegador';render()}if(a==='savePrices'){let p=data.products.find(x=>x.id===t.dataset.id),inputs=[...document.querySelectorAll('#editBack [data-price]')];let values=inputs.map(x=>Number(x.value));if(values.some((n,i)=>!Number.isFinite(n)||n<0||inputs[i].value===''))return alert('Precio inválido');p.variants.forEach((v,i)=>v.price=values[i]);save();document.getElementById('editBack')?.remove();notice='Precios actualizados en este navegador';render()}if(a==='export'){let rows=[['Código','Categoría','Producto','Presentación','Precio'],...data.products.flatMap(p=>p.variants.map(v=>[p.id,p.category,p.name,v.name,v.price]))];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='verdvida_catalogo.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}});
app.addEventListener('change',e=>{if(e.target.id==='orderType')orderType=e.target.value;if(e.target.id==='source')source=e.target.value;if(e.target.id==='pay'){pay=e.target.value;render()}});app.addEventListener('input',e=>{if(e.target.id==='search'||e.target.id==='searchAdmin'){query=e.target.value;let pos=e.target.selectionStart;render();let inp=document.getElementById(e.target.id);if(inp){inp.focus();inp.setSelectionRange(pos,pos)}}if(e.target.id==='received'){received=e.target.value;let parent=e.target.closest('.stack');let msg=parent?.querySelector('.muted');if(msg)msg.textContent=received!==''&&Number(received)>=total()?'Cambio: '+money(Number(received)-total()):'Ingresa el efectivo recibido.'}});render()})();
</script></body></html>
